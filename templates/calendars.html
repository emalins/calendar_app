<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Calendar Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body { height:100%; margin:0; font-family: Arial, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { padding:10px; background:#f4f4f4; display:flex; align-items:center; gap:12px; z-index:10; }
  #headerText { font-weight:700; }
  /* Make container positioned so overlay can be absolutely placed inside it */
  #calendarContainer {
    flex:1; display:flex; flex-direction:column; overflow:auto; padding-bottom:8px; position:relative;
    /* logo will be set inline via JS using snapshot.logo_path */
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
  }
  /* semi-opaque overlay under content so logo doesn't reduce readability */
  #calendarContainer::before {
    content: "";
    position: absolute;
    inset: 0;
    background: transparent; /* can be adjusted by JS if needed */
    pointer-events: none;
    z-index: 1;
  }

  .row { display:flex; flex:1 0 auto; min-height:68px; border-bottom:1px solid #e8e8e8; align-items:stretch; position:relative; z-index:2; }
  .label { width:160px; padding-left:10px; display:flex; align-items:center; font-weight:600; border-right:1px solid #eee; background: rgba(251,251,251,0.9); z-index:3; }
  .timeline { flex:1; position:relative; background:transparent; overflow:visible; z-index:4; }
  .iconcell { width:84px; min-width:84px; padding:6px; border-left:1px solid #eee; display:flex; align-items:center; justify-content:center; background: rgba(251,251,251,0.9); z-index:3; }
  .iconcell img { max-width:64px; max-height:56px; object-fit:contain; display:block; }

  .hour-grid-line { position:absolute; top:0; bottom:0; width:1px; background:#eee; z-index:2; }
  .hour-label {
    position:absolute;
    top:6px;
    font-size:var(--hour-label-font-size, 12px);
    font-family:var(--hour-label-font-family, Arial, sans-serif);
    color:var(--hour-label-color, #000000);
    transform:translateX(-50%);
    z-index:80;
    pointer-events:none;
    text-shadow:0 1px 2px rgba(255,255,255,0.85);
  }

  .event {
    position: absolute;
    height: 60%;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 6px;
    padding: 6px 8px;
    overflow: hidden;
    box-shadow: 0 1px 1px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    white-space: normal;
    word-break: break-word;
    box-sizing: border-box; /* ensure padding doesn't push out the right edge */
  }

  /* past overlay (global, sits above events but below now-line) */
  #pastOverlay {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 0px;
    z-index: 30;
    pointer-events: none;
  }

  /* Global now overlay sits above the past overlay and events */
  #globalNowOverlay {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    pointer-events: none;
    z-index: 50;
  }
  .now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    pointer-events: none;
    transition: left 0.8s linear;
    z-index: 55;
  }
  .now-badge {
    position: absolute;
    transform: translateX(-50%);
    color: white;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
    z-index: 60;
  }

  .fit .row { flex:1 1 0; }
  .nofit .row { flex:0 0 auto; }
  .meta { margin-left:auto; color:#555; font-size:13px; }

  /* error box for fetch/render problems */
  #errorBox { background:#fee; color:#800; padding:8px; margin:8px; border:1px solid #f99; display:none; z-index: 100; position: relative; }

  /* small responsiveness */
  @media (max-width:800px) {
    .label { width:120px; font-size:14px; }
    .iconcell { width:64px; min-width:64px; }
  }
</style>
</head>
<body>

<header>
  <div id="headerText">Calendar Dashboard</div>
  <div class="meta" id="dateNote"></div>
  <div class="meta" id="hoursNote" style="margin-left:18px"></div>
</header>

<div id="errorBox" role="alert"></div>
<div id="calendarContainer" class="nofit"></div>

<script>
/* Client-side calendar UI with:
   - background logo via snapshot.logo_path
   - right-hand icon column per calendar (uses calendar.icon; if not absolute URL prefix with /static/)
   - global translucent past overlay between left (workStart) and now line using snapshot.past_overlay

   Persistence fix: render() no longer clears the whole container; it removes only .row elements
   so the global overlays (now-line, badges and past overlay) persist across refreshes.
*/

const GAP_PX = 4; // small gap between overlapping columns

const errorBox = document.getElementById('errorBox');
const container = document.getElementById('calendarContainer');
const headerTextEl = document.getElementById('headerText');
const dateNote = document.getElementById('dateNote');
const hoursNote = document.getElementById('hoursNote');

/* To format server date to in a long format rather than 13/12/2006 format */
const serverDateOptions = {
  weekday: "long",
  year: "numeric",
  month: "long",
  day: "numeric",
};

let currentData = null;
let workStart = 8, workEnd = 18;
let fitToWindow = true;
let serverDate = new Date();
let eventPrefs = { show_times:false, font_size:12, font_family:'Arial, sans-serif', color:'#000' };
let hourLabelPrefs = { font_size:12, font_family:'Arial, sans-serif', color:'#000000' };
let nowPrefs = { color:'#e74c3c', thickness:2 };
let pastOverlayPrefs = { color:'#000000', opacity:0.12 };
let calendarBaseColors = [];

let globalNowOverlay = null;
let globalNowLine = null;
let globalNowBadgeTop = null;
let globalNowBadgeBottom = null;
let pastOverlay = null;

function showError(msg) {
  errorBox.style.display = 'block';
  errorBox.textContent = msg;
  console.error(msg);
}
function clearError() {
  errorBox.style.display = 'none';
  errorBox.textContent = '';
}

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hexToRgb(hex){ if(!hex) return {r:0,g:0,b:0}; hex=hex.replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join(''); const bi=parseInt(hex,16); return {r:(bi>>16)&255,g:(bi>>8)&255,b:bi&255}; }
function rgbToRgbaStr(rgb, a){ return `rgba(${rgb.r},${rgb.g},${rgb.b},${a})`; }
function shadeHsl(hex, deltaL){
  // simple approximate shade: scale RGB brightness
  try {
    const r = parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    function clampc(x){ return Math.max(0, Math.min(255, Math.round(x))); }
    const factor = 1 + (deltaL/100.0);
    return '#' + [clampc(r*factor), clampc(g*factor), clampc(b*factor)].map(v => v.toString(16).padStart(2,'0')).join('');
  } catch (e) {
    return hex || '#cccccc';
  }
}

/* text measuring for wrapping */
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');
function setMeasureFont(size,family){ measureCtx.font = `${size}px ${family}`; }
function measureTextWidth(text){ return measureCtx.measureText(text).width; }
function wrapTextToLines(text, maxWidthPx, size, family) {
  if(!text) return [''];
  setMeasureFont(size,family);
  const words = text.split(/\s+/);
  const lines = [];
  let current = '';
  for (let w of words) {
    const test = current ? (current + ' ' + w) : w;
    if (measureTextWidth(test) <= maxWidthPx) { current = test; continue; }
    if (!current) {
      let part = '';
      for (let ch of w) {
        if (measureTextWidth(part + ch) <= maxWidthPx) part += ch;
        else { if (part.length) lines.push(part); part = ch; }
      }
      if (part.length) current = part; else current = '';
      continue;
    }
    lines.push(current);
    current = w;
  }
  if (current) lines.push(current);
  return lines;
}
function truncateToWidthWithEllipsis(text, maxWidthPx, size, family) {
  setMeasureFont(size,family);
  const ell = '…';
  if (measureTextWidth(text) <= maxWidthPx) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = Math.floor((lo+hi+1)/2);
    const cand = text.slice(0,mid) + ell;
    if (measureTextWidth(cand) <= maxWidthPx) lo = mid; else hi = mid-1;
  }
  return text.slice(0,lo) + ell;
}

function buildEventLabel(ev) {
  let label = (ev.title||'').trim();
  if (eventPrefs.show_times && ev.start) {
    const t0 = hmTo12Compact(ev.start);
    const t1 = hmTo12Compact(ev.end || ev.start);
    label = `${label} (${t0} - ${t1})`;
  }
  return label;
}
function hmTo12Compact(hm){ if(!hm) return ''; let [h,m] = hm.split(':').map(Number); const am = h<12; const hour12 = ((h+11)%12)+1; if(!m || m===0) return `${hour12}${am?'AM':'PM'}`; return `${hour12}:${String(m).padStart(2,'0')}${am?'AM':'PM'}`; }
function minutesFromHM(hm){ const [h,m] = (hm||'00:00').split(':').map(Number); return (h||0)*60 + (m||0); }

function applyPrefsFromObject(obj) {
  try {
    workStart = Number(obj.work_start_hour) || 8;
    workEnd = Number(obj.work_end_hour) || 18;
    fitToWindow = Boolean(obj.fit_to_window);
    const hdr = obj.header || {};
    headerTextEl.textContent = hdr.text || "Calendar Dashboard";
    headerTextEl.style.fontSize = (hdr.font_size ? hdr.font_size + "px" : "20px");
    headerTextEl.style.fontFamily = hdr.font_family || "Arial, sans-serif";
    headerTextEl.style.color = hdr.color || "#1a1a1a";
    serverDate = new Date(obj.date || (new Date()).toISOString().slice(0,10));

    if (obj.event_prefs) {
      eventPrefs.show_times = Boolean(obj.event_prefs.show_times || false);
      eventPrefs.font_size = Number(obj.event_prefs.font_size) || 12;
      eventPrefs.font_family = obj.event_prefs.font_family || 'Arial, sans-serif';
      eventPrefs.color = obj.event_prefs.color || '#000';
    }
    if (obj.hour_label_prefs) {
      hourLabelPrefs.font_size = Number(obj.hour_label_prefs.font_size) || 12;
      hourLabelPrefs.font_family = obj.hour_label_prefs.font_family || 'Arial, sans-serif';
      hourLabelPrefs.color = obj.hour_label_prefs.color || '#000000';
    }
    container.style.setProperty('--hour-label-font-size', hourLabelPrefs.font_size + 'px');
    container.style.setProperty('--hour-label-font-family', hourLabelPrefs.font_family);
    container.style.setProperty('--hour-label-color', hourLabelPrefs.color);

    if (obj.now_prefs) {
      nowPrefs.color = obj.now_prefs.color || nowPrefs.color;
      nowPrefs.thickness = Number(obj.now_prefs.thickness) || nowPrefs.thickness;
    }
    if (obj.past_overlay) {
      pastOverlayPrefs.color = obj.past_overlay.color || pastOverlayPrefs.color;
      pastOverlayPrefs.opacity = Number(obj.past_overlay.opacity) || pastOverlayPrefs.opacity;
    }
    calendarBaseColors = Array.isArray(obj.calendar_colors) ? obj.calendar_colors.slice() : [];
    // logo_path handled in fetchData
  } catch (ex) {
    console.error('applyPrefsFromObject error', ex);
  }
}

async function fetchData() {
  clearError();
  try {
    const res = await fetch('/api/events');
    if (!res.ok) {
      showError('Failed to fetch events: ' + res.status + ' ' + res.statusText);
      return;
    }
    const obj = await res.json();
    if (!obj) { showError('Empty response from server'); return; }
    applyPrefsFromObject(obj);
    currentData = Array.isArray(obj.calendars) ? obj.calendars : (obj.calendars || []);
    dateNote.textContent = serverDate.toLocaleDateString("en-GB",serverDateOptions);    
    hoursNote.textContent = `Hours: ${String(workStart).padStart(2,'0')}:00–${String(workEnd).padStart(2,'0')}:00`;
    if (fitToWindow) container.classList.add('fit'), container.classList.remove('nofit'); else container.classList.add('nofit'), container.classList.remove('fit');

    // apply logo background if provided
    if (obj.logo_path) {
      container.style.backgroundImage = `url("${obj.logo_path}")`;
      // Optional: adjust dimming via ::before if you want (left transparent here)
      container.style.setProperty('--logo-dim', 'transparent');
    } else {
      container.style.backgroundImage = '';
    }

    // keep overlays persistent and re-render rows
    render();
  } catch (err) {
    showError('Error fetching or parsing data: ' + (err && err.message ? err.message : String(err)));
    console.error(err);
  }
}

function ensureGlobalNowOverlay() {
  if (globalNowOverlay) return;
  globalNowOverlay = document.createElement('div');
  globalNowOverlay.id = 'globalNowOverlay';

  pastOverlay = document.createElement('div');
  pastOverlay.id = 'pastOverlay';

  globalNowLine = document.createElement('div');
  globalNowLine.className = 'now-line';
  globalNowBadgeTop = document.createElement('div');
  globalNowBadgeTop.className = 'now-badge';
  globalNowBadgeBottom = document.createElement('div');
  globalNowBadgeBottom.className = 'now-badge';
  globalNowBadgeTop.style.top = '4px';
  globalNowBadgeBottom.style.bottom = '4px';

  globalNowOverlay.appendChild(pastOverlay);
  globalNowOverlay.appendChild(globalNowLine);
  globalNowOverlay.appendChild(globalNowBadgeTop);
  globalNowOverlay.appendChild(globalNowBadgeBottom);
  container.appendChild(globalNowOverlay);
}

function render() {
  try {
    // Remove only existing calendar rows (preserve overlays)
    container.querySelectorAll('.row').forEach(n => n.remove());

    // Ensure overlays exist and are kept mounted
    ensureGlobalNowOverlay();

    if (!currentData || !currentData.length) {
      const p = document.createElement('div');
      p.style.padding = '12px';
      p.textContent = 'No calendars found. Please check calendars.txt.';
      container.appendChild(p);
      return;
    }

    const startMin = workStart*60, endMin = workEnd*60, totalRange = Math.max(1, endMin - startMin);
    const hours = workEnd - workStart;

    // Build rows
    currentData.forEach((cal, calIdx) => {
      const row = document.createElement('div'); row.className = 'row';
      const label = document.createElement('div'); label.className = 'label'; label.textContent = cal.label || '';
      const timeline = document.createElement('div'); timeline.className = 'timeline';
      const iconcell = document.createElement('div'); iconcell.className = 'iconcell';

      // icon logic:
      if (cal.icon) {
        let src = cal.icon;
        if (!/^[a-zA-Z]+:\/\//.test(src) && !src.startsWith('/')) {
          src = '/static/' + src;
        }
        const img = document.createElement('img'); img.src = src; img.alt = cal.label || '';
        img.onerror = () => { img.style.display = 'none'; };
        iconcell.appendChild(img);
      }

      // hour grid
      for (let i=0;i<=hours;i++){
        const hour = workStart + i;
        const pos = ((hour*60 - startMin)/totalRange)*100;
        const line = document.createElement('div'); line.className='hour-grid-line'; line.style.left = pos + '%';
        timeline.appendChild(line);
        if (i < hours) {
          const hl = document.createElement('div'); hl.className='hour-label'; hl.style.left = pos + '%';
          // Apply preferences inline as well as via CSS variables, so the labels
          // keep the requested style even if external CSS is cached or overridden.
          hl.style.color = hourLabelPrefs.color || '#000000';
          hl.style.fontSize = (hourLabelPrefs.font_size || 12) + 'px';
          hl.style.fontFamily = hourLabelPrefs.font_family || 'Arial, sans-serif';
          hl.textContent = String(hour).padStart(2,'0') + ':00'; timeline.appendChild(hl);
        }
      }

      // determine base colour
      let baseHex = (calIdx < calendarBaseColors.length) ? calendarBaseColors[calIdx] : null;
      if (!baseHex) baseHex = '#2ecc71';
      const shadeA = shadeHsl(baseHex, -6);
      const shadeB = shadeHsl(baseHex, +6);

      // append row now so timeline.clientWidth is measurable for calculations
      row.appendChild(label); row.appendChild(timeline); row.appendChild(iconcell); container.appendChild(row);

      // compute layout for events with overlap avoidance (like prior version)
      const rawEvents = (cal.events || []).map((ev, idx) => {
        return {
          _orig: ev,
          idx,
          startMin: minutesFromHM(ev.start || '00:00'),
          endMin: minutesFromHM(ev.end || ev.start || '00:00'),
        };
      }).filter(e => e.startMin < e.endMin);

      if (rawEvents.length > 0) {
        rawEvents.sort((a,b) => a.startMin - b.startMin || a.endMin - b.endMin);

        // overlapping groups
        const groups = [];
        let currentGroup = [];
        let currentGroupMaxEnd = -1;
        rawEvents.forEach(ev => {
          if (currentGroup.length === 0) {
            currentGroup.push(ev);
            currentGroupMaxEnd = ev.endMin;
          } else {
            if (ev.startMin < currentGroupMaxEnd) {
              currentGroup.push(ev);
              currentGroupMaxEnd = Math.max(currentGroupMaxEnd, ev.endMin);
            } else {
              groups.push({events: currentGroup, groupStart: currentGroup[0].startMin, groupEnd: currentGroupMaxEnd});
              currentGroup = [ev];
              currentGroupMaxEnd = ev.endMin;
            }
          }
        });
        if (currentGroup.length) groups.push({events: currentGroup, groupStart: currentGroup[0].startMin, groupEnd: currentGroupMaxEnd});

        groups.forEach(group => {
          const colsEnd = [];
          group.events.forEach(ev => {
            let col = colsEnd.findIndex(end => ev.startMin >= end);
            if (col === -1) { col = colsEnd.length; colsEnd.push(ev.endMin); }
            else { colsEnd[col] = ev.endMin; }
            ev.col = col;
          });
          group.cols = colsEnd.length;
          group.events.forEach(ev => ev.groupCols = group.cols);
        });

        // compute gap percent based on timeline width
        const tlWidth = timeline.clientWidth || timeline.getBoundingClientRect().width || 1;
        const gapPx = GAP_PX;
        const gapPct = tlWidth > 0 ? (gapPx / tlWidth) * 100 : 0;

        rawEvents.forEach(ev => {
          const s = Math.max(ev.startMin, startMin);
          const e = Math.min(ev.endMin, endMin);
          if (e <= s) return;

          const leftPctBase = ((s - startMin) / totalRange) * 100;
          const widthPctBase = ((e - s) / totalRange) * 100;

          const cols = ev.groupCols || 1;
          const colIndex = ev.col || 0;
          const totalGroupGapsPct = (cols - 1) * gapPct;
          const usableWidthPct = Math.max(0.1, widthPctBase - totalGroupGapsPct);
          const widthPct = usableWidthPct / cols;
          const leftPct = leftPctBase + colIndex * (widthPct + gapPct);

          const div = document.createElement('div'); div.className = 'event';
          div.style.left = leftPct + '%'; div.style.width = widthPct + '%';
          const colour = (ev.idx % 2 === 0) ? shadeA : shadeB;
          div.style.background = colour;
          div.style.color = eventPrefs.color || '#000';
          div.style.fontSize = (eventPrefs.font_size ? eventPrefs.font_size + 'px' : '12px');
          div.style.fontFamily = eventPrefs.font_family || 'Arial, sans-serif';
          div.style.zIndex = 20 + (colIndex || 0);
          timeline.appendChild(div);

          requestAnimationFrame(() => {
            try {
              const style = getComputedStyle(div);
              const padL = parseFloat(style.paddingLeft) || 0;
              const padR = parseFloat(style.paddingRight) || 0;
              const availableWidth = Math.max(10, div.clientWidth - padL - padR);
              const boxHeight = Math.max(6, div.clientHeight);
              let lh;
              if (style.lineHeight && style.lineHeight !== 'normal') {
                if (style.lineHeight.endsWith('px')) lh = parseFloat(style.lineHeight);
                else lh = (eventPrefs.font_size || 12) * 1.2;
              } else lh = (eventPrefs.font_size || 12) * 1.2;
              const maxLines = Math.max(1, Math.floor(boxHeight / lh));
              const labelText = buildEventLabel(ev._orig);
              const rawLines = wrapTextToLines(labelText, availableWidth, eventPrefs.font_size, eventPrefs.font_family);
              let lines = rawLines;
              if (lines.length > maxLines) {
                const keep = lines.slice(0, maxLines);
                keep[keep.length - 1] = truncateToWidthWithEllipsis(keep[keep.length - 1], availableWidth, eventPrefs.font_size, eventPrefs.font_family);
                lines = keep;
              }
              function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
              div.innerHTML = lines.map(esc).join('<br>');
            } catch(inner){ console.error('wrap/render inner error', inner); }
          });
        });
      }
    });

    // overlays persist; update positions
    updateNowLine();

  } catch (err) {
    showError('Rendering error: ' + (err && err.message ? err.message : String(err)));
    console.error(err);
  }
}

// Compute pixel X inside container corresponding to time percent
function computeNowX(clampedPct) {
  const firstTimeline = container.querySelector('.timeline');
  if (!firstTimeline) return null;
  const containerRect = container.getBoundingClientRect();
  const tlRect = firstTimeline.getBoundingClientRect();
  const leftRel = tlRect.left - containerRect.left;
  const x = leftRel + (clampedPct / 100) * tlRect.width;
  return x;
}

function updateNowLine() {
  try {
    if (!globalNowOverlay) return;
    const now = new Date();
    const startMin = workStart*60, endMin = workEnd*60, totalRange = Math.max(1, endMin - startMin);
    const minutes = now.getHours()*60 + now.getMinutes();
    let clampedPct;
    if (minutes < startMin) clampedPct = 0;
    else if (minutes > endMin) clampedPct = 100;
    else clampedPct = ((minutes - startMin) / totalRange) * 100;

    const x = computeNowX(clampedPct);
    const firstTimeline = container.querySelector('.timeline');
    if (!firstTimeline) {
      globalNowLine.style.display = 'none';
      globalNowBadgeTop.style.display = 'none';
      globalNowBadgeBottom.style.display = 'none';
      pastOverlay.style.display = 'none';
      return;
    }

    const containerRect = container.getBoundingClientRect();
    const tlRect = firstTimeline.getBoundingClientRect();
    const tlLeft = tlRect.left - containerRect.left;

    if (x === null || Number.isNaN(x)) {
      globalNowLine.style.display = 'none';
      globalNowBadgeTop.style.display = 'none';
      globalNowBadgeBottom.style.display = 'none';
      pastOverlay.style.display = 'none';
      return;
    }

    globalNowLine.style.display = 'block';
    globalNowBadgeTop.style.display = 'block';
    globalNowBadgeBottom.style.display = 'block';
    pastOverlay.style.display = 'block';

    // now-line styling
    const thicknessPx = (nowPrefs.thickness && Number(nowPrefs.thickness)) ? Number(nowPrefs.thickness) : 2;
    const color = nowPrefs.color || '#e74c3c';
    globalNowLine.style.width = thicknessPx + 'px';
    globalNowLine.style.background = color;
    globalNowLine.style.left = x + 'px';
    globalNowLine.style.marginLeft = (thicknessPx / -2) + 'px';

    globalNowBadgeTop.style.left = x + 'px';
    globalNowBadgeTop.style.background = color;
    globalNowBadgeBottom.style.left = x + 'px';
    globalNowBadgeBottom.style.background = color;

    const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
    globalNowBadgeTop.textContent = `${hh}:${mm}`;
    globalNowBadgeBottom.textContent = `${hh}:${mm}`;

    // past overlay: span from left of timeline to x
    const leftPx = tlLeft;
    const widthPx = Math.max(0, x - tlLeft);
    pastOverlay.style.left = leftPx + 'px';
    pastOverlay.style.width = widthPx + 'px';
    const rgb = hexToRgb(pastOverlayPrefs.color || '#000000');
    const a = (typeof pastOverlayPrefs.opacity === 'number') ? pastOverlayPrefs.opacity : 0.12;
    pastOverlay.style.background = `rgba(${rgb.r},${rgb.g},${rgb.b},${a})`;

  } catch (err) {
    console.error('updateNowLine error', err);
  }
}

// initial load & timers
fetchData();
setInterval(fetchData, 300000);   // refresh ICS every 5 minutes

// aligned minute updates for now-line
function scheduleAlignedNowUpdates() {
  try { updateNowLine(); } catch (e) { console.error('updateNowLine immediate error', e); }
  const now = new Date();
  const msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
  setTimeout(() => {
    try { updateNowLine(); } catch (e) { console.error('updateNowLine timeout error', e); }
    setInterval(() => {
      try { updateNowLine(); } catch (e) { console.error('updateNowLine interval error', e); }
    }, 60 * 1000);
  }, msUntilNextMinute);
}
scheduleAlignedNowUpdates();

</script>
